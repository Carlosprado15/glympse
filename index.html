<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE - LUXURY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; }

        /* VÍDEO CINEMATOGRÁFICO DE LUXO */
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; filter: brightness(0.8); }

        /* INTERFACE DE ALTA COSTURA */
        .ui-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; pointer-events: none; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 50%, rgba(0,0,0,0.3) 100%); }
        
        .header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 6px; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .logo span { color: #ff3e60; }
        
        .main-info { margin-bottom: 100px; pointer-events: auto; }
        .badge { background: rgba(255, 62, 96, 0.2); border: 1px solid #ff3e60; color: #ff3e60; padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 15px; letter-spacing: 2px; }
        .title { font-size: 35px; font-weight: 800; line-height: 1.1; text-transform: uppercase; }

        /* SIDEBAR DE AÇÕES */
        .sidebar { position: absolute; right: 25px; bottom: 180px; display: flex; flex-direction: column; gap: 30px; pointer-events: auto; }
        .btn-side { width: 55px; height: 55px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); font-size: 22px; transition: 0.3s; }

        /* NAVEGAÇÃO PREMIUM */
        .nav { position: fixed; bottom: 0; width: 100%; height: 90px; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); pointer-events: auto; padding-bottom: 15px; }
        .nav-item { text-align: center; color: #555; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        .nav-item.active { color: #fff; }
        .nav-item.pro { color: #ffcf33; }

        /* ENTRADA COM ESTILO */
        #gate { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.5s; }
        .gate-btn { border: 1px solid #fff; color: #fff; padding: 18px 40px; border-radius: 50px; font-weight: bold; letter-spacing: 3px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="gate" onclick="startApp()">
        <div style="color:white; font-size: 35px; font-weight: 900; letter-spacing: 12px; margin-bottom: 30px;">GLYMPSE</div>
        <div class="gate-btn">UNLOCK SYSTEM</div>
    </div>

    <div class="video-container">
        <video id="v" loop playsinline muted>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-top-view-of-a-liquid-with-sparkles-and-shiny-particles-32439-large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="ui-overlay">
        <div class="header">
            <div class="logo">GLY<span>MPSE</span></div>
            <div style="font-size: 22px;">🔍 👑</div>
        </div>

        <div class="main-info">
            <div class="badge">⚡ PREMIUM ACCESS</div>
            <div class="title">VISÃO SINTÉTICA<br>DE ELITE</div>
        </div>

        <div class="sidebar">
            <div class="btn-side">❤️</div>
            <div class="btn-side">🔗</div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active">⚡<br>FEED</div>
        <div class="nav-item">🎲<br>ROLETA</div>
        <div class="nav-item pro">👑<br>PRO</div>
        <div class="nav-item">👤<br>PERFIL</div>
    </div>

    <script>
        function startApp() {
            const v = document.getElementById('v');
            v.muted = false;
            v.play();
            document.getElementById('gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('gate').style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
