<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        /* VIDEO ENGINE - ACEITA QUALQUER MP4 DE ALTA QUALIDADE */
        .video-wrapper { position: fixed; inset: 0; z-index: -1; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* CAMADA DE INTERFACE - ORGANIZAÇÃO SEM SOBREPOSIÇÃO */
        .interface { 
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; 
            justify-content: space-between; 
            padding: 25px; 
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
        }

        /* HEADER: ÍCONES AFASTADOS DAS LETRAS */
        .header { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .brand { font-size: 24px; font-weight: 900; letter-spacing: 5px; }
        .brand span { color: #ff3e60; }
        .top-nav-icons { display: flex; gap: 15px; font-size: 20px; }

        /* CONTEÚDO PRINCIPAL (RECUADO PARA NÃO BATER NOS BOTÕES) */
        .main-info { margin-bottom: 100px; pointer-events: auto; max-width: 75%; }
        .status-tag { 
            background: rgba(255, 62, 96, 0.2); border: 1px solid #ff3e60; color: #ff3e60; 
            padding: 5px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; 
            display: inline-block; margin-bottom: 12px; letter-spacing: 1px;
        }
        .main-title { font-size: 30px; font-weight: 800; line-height: 1.1; text-transform: uppercase; margin-bottom: 8px; }
        .sub-text { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.4; }

        /* BARRA LATERAL DE AÇÕES */
        .side-bar { position: absolute; right: 20px; bottom: 180px; display: flex; flex-direction: column; gap: 25px; pointer-events: auto; }
        .action-circle { 
            width: 52px; height: 52px; background: rgba(255,255,255,0.08); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); font-size: 20px;
        }

        /* MENU INFERIOR FIXO */
        .bottom-bar { 
            position: fixed; bottom: 0; width: 100%; height: 85px; 
            background: rgba(0,0,0,0.92); display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid rgba(255,255,255,0.05); 
            pointer-events: auto; padding-bottom: 15px; z-index: 10;
        }
        .menu-btn { text-align: center; color: #666; font-size: 10px; font-weight: bold; text-decoration: none; }
        .menu-btn.active { color: #fff; }
        .menu-btn.gold { color: #ffcf33; }

        /* TELA DE START (ESSENCIAL PARA LIBERAR O VÍDEO) */
        #startScreen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .start-label { border: 1px solid #fff; padding: 15px 35px; border-radius: 2px; font-weight: bold; letter-spacing: 3px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="startScreen" onclick="initGlympse()">
        <div style="font-size: 35px; font-weight: 900; letter-spacing: 12px; margin-bottom: 30px;">GLYMPSE</div>
        <div class="start-label">ACESSAR SISTEMA</div>
    </div>

    <div class="video-wrapper">
        <video id="player" loop playsinline muted>
            <source src="https://raw.githubusercontent.com/yannbf/video-files/main/ocean-waves.mp4" type="video/mp4">
        </video>
    </div>

    <div class="interface">
        <div class="header">
            <div class="brand">GLY<span>MPSE</span></div>
            <div class="top-nav-icons">🔍 👑</div>
        </div>

        <div class="main-info">
            <div class="status-tag">⚡ SISTEMA ATIVO</div>
            <div class="main-title">VISÃO SINTÉTICA<br>ESTABELECIDA</div>
            <div class="sub-text">Conexão via satélite confirmada. Iniciando feed autônomo de alta resolução.</div>
        </div>

        <div class="side-bar">
            <div class="action-circle">❤️</div>
            <div class="action-circle">🔗</div>
        </div>
    </div>

    <nav class="bottom-bar">
        <a href="#" class="menu-btn active">⚡<br>FEED</a>
        <a href="#" class="menu-btn">🎲<br>ROLETA</a>
        <a href="#" class="menu-btn gold">👑<br>PRO</a>
        <a href="#" class="menu-btn">👤<br>PERFIL</a>
    </nav>

    <script>
        function initGlympse() {
            const video = document.getElementById('player');
            video.muted = false;
            video.play();
            document.getElementById('startScreen').style.display = 'none';
        }
    </script>
</body>
</html>
