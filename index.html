<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        /* VÍDEO DE FUNDO - Ajustado para rodar no Android */
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        .video-bg { width: 100%; height: 100%; object-fit: cover; }

        /* INTERFACE LUXURY HIGH-TECH */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.4) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .logo span { color: #ff3e60; }
        .status-icons { display: flex; gap: 15px; }
        .icon-btn { background: rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }

        .content { margin-bottom: 80px; }
        .tag { background: rgba(255, 62, 96, 0.2); border: 1px solid #ff3e60; color: #ff3e60; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; text-transform: uppercase; }
        .title { font-size: 28px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .desc { font-size: 14px; color: #ccc; max-width: 80%; line-height: 1.4; }

        .sidebar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; align-items: center; pointer-events: auto; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .action-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .action-label { font-size: 10px; color: #aaa; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); pointer-events: auto; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.6; }
        .nav-item.active { opacity: 1; color: #ffcf33; }
        .nav-label { font-size: 10px; text-transform: uppercase; font-weight: bold; }

        /* BOTÃO DE DESTRAVAR VÍDEO (SÓ APARECE SE O VÍDEO NÃO RODAR) */
        #tapBtn { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); cursor: pointer; pointer-events: auto; }
        .play-hint { background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px; border: 1px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="mainVideo" class="video-bg" autoplay muted loop playsinline webkit-playsinline>
            <source src="https://n7z8p9z4.rocketcdn.me/wp-content/uploads/2021/12/metodo-creao.mp4" type="video/mp4">
        </video>
    </div>

    <div id="tapBtn">
        <div class="play-hint">TOQUE PARA INICIAR GLYMPSE</div>
    </div>

    <div class="overlay">
        <div class="header">
            <div class="logo">GLY<span>MPSE</span></div>
            <div class="status-icons">
                <div class="icon-btn">🔍</div>
                <div class="icon-btn">👑</div>
            </div>
        </div>

        <div class="content">
            <div class="tag">⚡ DEEP SHOCK</div>
            <div class="title">CHUVA DE METEOROS <br>EM CÂMERA LENTA</div>
            <div class="desc">Capturado no deserto do Saara. Ninguém acreditou que fosse real.</div>
        </div>

        <div class="sidebar">
            <div class="action-item">
                <div class="action-btn">❤️</div>
                <div class="action-label">Curtir</div>
            </div>
            <div class="action-item">
                <div class="action-btn">🔗</div>
                <div class="action-label">Compartilhar</div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active"><span style="font-size: 20px;">🔥</span><div class="nav-label">FEED</div></div>
        <div class="nav-item"><span style="font-size: 20px;">🎲</span><div class="nav-label">ROLETA</div></div>
        <div class="nav-item"><span style="font-size: 20px;">👑</span><div class="nav-label" style="color: #ffcf33;">PRO</div></div>
        <div class="nav-item"><span style="font-size: 20px;">👤</span><div class="nav-label">PERFIL</div></div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const tapBtn = document.getElementById('tapBtn');

        // Quando o usuário toca na tela, o vídeo tenta rodar (com áudio se quiser)
        tapBtn.addEventListener('click', () => {
            video.muted = false; // Tenta liberar o som após o toque
            video.play();
            tapBtn.style.display = 'none'; // Esconde o aviso de toque
        });

        // Garante que o vídeo tente rodar assim que carregar (mesmo mudo)
        window.addEventListener('load', () => {
            video.play().catch(error => {
                console.log("Aguardando interação do usuário para rodar o vídeo.");
            });
        });
    </script>
</body>
</html>
