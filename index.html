<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .video-bg { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent, rgba(0,0,0,0.8)); }
        .logo { font-size: 26px; font-weight: bold; letter-spacing: 4px; }
        .logo span { color: #ff3e60; }
        .content { margin-bottom: 100px; }
        .tag { color: #ff3e60; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        #tapBtn { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: white; cursor: pointer; text-align: center; padding: 20px; }
        .play-box { border: 2px solid #fff; padding: 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="tapBtn">
        <div class="play-box">CLIQUE AQUI PARA<br>ENTRAR NO GLYMPSE</div>
    </div>

    <div class="video-container">
        <video id="mainVideo" class="video-bg" loop playsinline muted>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-out-of-focus-31511-large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="overlay">
        <div class="logo">GLY<span>MPSE</span></div>
        <div class="content">
            <div class="tag">⚡ SISTEMA ATIVO</div>
            <div class="title">REDE SINTÉTICA <br>ESTABELECIDA</div>
            <p>Conexão via satélite confirmada.</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const tapBtn = document.getElementById('tapBtn');

        tapBtn.addEventListener('click', () => {
            video.muted = false; 
            video.play();
            tapBtn.style.display = 'none'; 
        });
    </script>
</body>
</html>
