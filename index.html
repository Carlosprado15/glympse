<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE - CORE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #canvas-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* Botão de emergência se nada carregar */
        #status-display { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; color: white; text-align: center; font-family: sans-serif;
        }
        .btn-ready { border: 2px solid #fff; padding: 20px 40px; cursor: pointer; display: none; background: #000; }
    </style>
</head>
<body>

    <div id="status-display">
        <div id="loader-msg">CARREGANDO SISTEMA VITAL...</div>
        <div id="start-btn" class="btn-ready" onclick="forcePlay()">ENTRAR NO FEED</div>
    </div>

    <video id="v" loop playsinline muted style="display:none;"></video>
    <canvas id="canvas-video"></canvas>

    <script>
        const video = document.getElementById('v');
        const canvas = document.getElementById('canvas-video');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('loader-msg');
        const btn = document.getElementById('start-btn');

        // URL estável de teste (Vou usar uma que o GitHub aceita sem frescura)
        const videoUrl = "https://raw.githubusercontent.com/yannbf/video-files/main/ocean-waves.mp4";

        async function loadVideo() {
            try {
                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                video.src = url;
                video.load();
                
                video.oncanplaythrough = () => {
                    msg.style.display = 'none';
                    btn.style.display = 'block';
                };
            } catch (e) {
                msg.innerHTML = "ERRO DE CONEXÃO: Verifique o link do vídeo.";
            }
        }

        function forcePlay() {
            document.getElementById('status-display').style.display = 'none';
            video.style.display = 'block';
            video.play();
            render();
        }

        function render() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(render);
        }

        loadVideo();
    </script>
</body>
</html>
