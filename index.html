<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE FIX</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        video { 
            position: fixed; inset: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 1; 
        }

        #overlay { 
            position: fixed; inset: 0; z-index: 10; 
            background: rgba(0,0,0,0.8); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; font-family: sans-serif; cursor: pointer;
        }
        .btn { border: 1px solid #fff; padding: 15px 30px; letter-spacing: 2px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startNow()">
        <div style="font-size: 24px; margin-bottom: 20px; letter-spacing: 8px;">GLYMPSE</div>
        <div class="btn">CLIQUE PARA INICIAR VÍDEO</div>
    </div>

    <video id="v" loop playsinline muted autoplay preload="auto">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById('v');

        function startNow() {
            // Remove a trava de som e força o play
            v.muted = false; 
            const playPromise = v.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    document.getElementById('overlay').style.display = 'none';
                }).catch(error => {
                    alert("O navegador impediu o vídeo: " + error);
                });
            }
        }

        // Força o carregamento assim que o script lê a página
        v.load();
    </script>
</body>
</html>
