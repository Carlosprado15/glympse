<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLYMPSE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        /* VÍDEO: Ocupa a tela toda sem distorcer */
        .video-bg-box { position: fixed; inset: 0; z-index: -1; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        /* INTERFACE: Organizada para não sobrepor nada */
        .ui-wrapper { 
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; 
            justify-content: space-between; 
            padding: 25px; 
            pointer-events: none; 
        }

        /* HEADER: Logo e ícones nas extremidades */
        .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 5px; }
        .logo span { color: #ff3e60; }
        .top-btns { font-size: 20px; display: flex; gap: 15px; }

        /* TEXTO: Recuado para não bater nos botões da direita */
        .bottom-info { margin-bottom: 100px; pointer-events: auto; max-width: 70%; }
        .tag-status { background: rgba(255, 62, 96, 0.2); border: 1px solid #ff3e60; color: #ff3e60; padding: 5px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .headline { font-size: 28px; font-weight: 800; line-height: 1.1; text-transform: uppercase; }

        /* SIDEBAR: Botões de ação na direita */
        .side-actions { position: absolute; right: 20px; bottom: 180px; display: flex; flex-direction: column; gap: 25px; pointer-events: auto; }
        .btn-action { width: 52px; height: 52px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); font-size: 20px; }

        /* MENU INFERIOR */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; pointer-events: auto; }
        .tab-item { text-align: center; font-size: 10px; font-weight: bold; color: #666; }
        .tab-item.active { color: #fff; }

        /* TELA DE ENTRADA (O SEGREDO PARA RODAR NO ANDROID) */
        #gate { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .gate-btn { border: 1px solid #fff; padding: 15px 35px; border-radius: 4px; font-weight: bold; letter-spacing: 2px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="gate" onclick="unlock()">
        <div style="font-size: 30px; font-weight: 900; letter-spacing: 10px; margin-bottom: 20px;">GLYMPSE</div>
        <div class="gate-btn">INICIAR</div>
    </div>

    <div class="video-bg-box">
        <video id="v" loop playsinline muted autoplay>
            <source src="https://raw.githubusercontent.com/yannbf/video-files/main/ocean-waves.mp4" type="video/mp4">
        </video>
    </div>

    <div class="ui-wrapper">
        <div class="top-bar">
            <div class="logo">GLY<span>MPSE</span></div>
            <div class="top-btns">🔍 👑</div>
        </div>

        <div class="bottom-info">
            <div class="tag-status">⚡ CONEXÃO ATIVA</div>
            <div class="headline">ESTÉTICA DE LUXO<br>CONFIGURADA</div>
        </div>

        <div class="side-actions">
            <div class="btn-action">❤️</div>
            <div class="btn-action">🔗</div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active">⚡<br>FEED</div>
        <div class="tab-item">🎲<br>ROLETA</div>
        <div class="tab-item" style="color:#ffcf33;">👑<br>PRO</div>
        <div class="tab-item">👤<br>PERFIL</div>
    </div>

    <script>
        function unlock() {
            const v = document.getElementById('v');
            v.muted = false; // Libera o som
            v.play(); // Garante que o play aconteça
            document.getElementById('gate').style.display = 'none';
        }
    </script>
</body>
</html>
